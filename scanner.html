        const updatedMcq = rubric.mcq.map((q) => ({ ...q, points: 15 }));
        const updatedBlanks = rubric.blanks.map((b) => ({ ...b, points: 15 }));
        const exPoint = targetExerciseCount === 5 ? 36 : 45;
        const updatedExercises = rubric.exercises.map((ex) => ({ ...ex, points: exPoint }));
        setRubric({ ...rubric, exerciseCount: targetExerciseCount, mcq: updatedMcq, blanks: updatedBlanks, exercises: updatedExercises });
        showToast('تمت موازنة سلم التصحيح تلقائياً إلى 300 درجة (60 + 60 + 180)!');
      };

      const applyPreset = (presetKey) => {
        const preset = JSON.parse(JSON.stringify(SYRIAN_CURRICULUM_PRESETS_300[presetKey]));
        setRubric(preset);
        setScanResult(null);
        showToast(`تم تحميل نموذج ${preset.grade} (الدرجة الكاملة: 300 درجة)`);
      };

      // محاكاة فورية ومحلية في حال عدم إدخال مفتاح API خارجي
      const buildSimulatedResult = (profile) => {
        const isPartial = profile === 'partial';
        return {
          studentName: isPartial ? 'خالد سامر الدرويش' : 'سارة محمود العلي',
          studentClass: `${rubric.grade} - الشعبة الأولى`,
          mcqResults: rubric.mcq.map((q, idx) => {
            const wrong = isPartial && idx === 3;
            const det = wrong ? (q.correctOption === 'أ' ? 'ج' : 'أ') : q.correctOption;
            return {
              questionNumber: idx + 1,
              detectedOption: det,
              correctOption: q.correctOption,
              isCorrect: !wrong,
              awardedPoints: wrong ? 0 : q.points,
              maxPoints: q.points
            };
          }),
          blankResults: rubric.blanks.map((b, idx) => {
            const partialBlank = isPartial && idx === 1;
            return {
              questionNumber: idx + 1,
              detectedText: partialBlank ? 'كتب القانون بدون إكمال التبسيط' : b.expectedAnswer,
              expectedAnswer: b.expectedAnswer,
              isCorrect: !partialBlank,
              awardedPoints: partialBlank ? Math.round(b.points / 2) : b.points,
              maxPoints: b.points,
              comment: partialBlank ? 'تم منح نصف العلامة لكتابة العلاقة الصحيحة' : 'إجابة نموذجية مطابقة'
            };
          }),
          exerciseResults: activeExercises.map((ex, idx) => {
            const hasCalcError = isPartial && idx >= activeExercises.length - 2;
            const awarded = hasCalcError ? Math.round(ex.points * 0.75) : ex.points;
            return {
              exerciseNumber: idx + 1,
              transcribedSteps: `${ex.expectedSteps} — [الاستنتاج المكتوب: ${hasCalcError ? 'خطأ حسابي في التعويض الأخير' : ex.expectedFinal}]`,
              stepsBreakdown: hasCalcError ? `خطوات البرهان كاملة (${awarded}/${ex.points})` : `برهان وجواب كامل (${ex.points}/${ex.points})`,
              awardedPoints: awarded,
              maxPoints: ex.points,
              status: hasCalcError ? 'جزئي' : 'كامل',
              teacherNote: hasCalcError
                ? 'كتب الطالب خطوات البرهان والمبرهنات بشكل سليم، وحُسمت علامة الناتج النهائي فقط.'
                : 'تسلسل منطقي وبرهان هندسي/جبري مكتمل ومطابق لسلم التصحيح.'
            };
          }),
          overallFeedback: isPartial
            ? 'الطالب متمكن من خطوات البرهان الهندسي لكنه يحتاج لمراجعة العمليات الحسابية النهائية.'
            : 'ورقة ممتازة ومرتبة، جميع البراهين الهندسية والمعادلات الجبرية مكتوبة بدقة كاملة.'
        };
      };

      const generateHandwrittenStudentSheet = (profile = 'excellent') => {
        const canvas = document.createElement('canvas');
        canvas.width = 1200;
        canvas.height = 1650;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#000000';
        ctx.fillRect(30, 30, 34, 34);
        ctx.fillRect(canvas.width - 64, 30, 34, 34);
        ctx.fillRect(30, canvas.height - 64, 34, 34);
        ctx.fillRect(canvas.width - 64, canvas.height - 64, 34, 34);

        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 3;
        ctx.strokeRect(75, 45, canvas.width - 150, canvas.height - 90);

        ctx.direction = 'rtl';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 24px Tajawal, Arial';
        ctx.fillText(`الجمهورية العربية السورية - ${rubric.schoolName}`, canvas.width / 2, 95);
        ctx.font = 'bold 20px Tajawal, Arial';
        ctx.fillText(`${rubric.grade} | ${rubric.title} (300 درجة)`, canvas.width / 2, 130);

        ctx.textAlign = 'right';
        ctx.fillStyle = '#1d4ed8';
        ctx.font = 'bold 20px Tajawal, Arial';
        ctx.fillText(
          profile === 'excellent' ? 'اسم الطالب: سارة محمود العلي (ورقة نموذجية)' : 'اسم الطالب: خالد سامر الدرويش (علامة جزئية)',
          1100,
          175
        );

        activeExercises.forEach((ex, idx) => {
          const y = 220 + idx * 280;
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 2;
          ctx.strokeRect(95, y, 1010, 250);
          ctx.fillStyle = '#0f172a';
          ctx.font = 'bold 18px Tajawal, Arial';
          ctx.fillText(`${ex.title} (${ex.points} درجة): ${ex.prompt.slice(0, 75)}`, 1085, y + 35);
          ctx.fillStyle = '#1e40af';
          ctx.font = '18px Tajawal, Arial';
          ctx.fillText(`البرهان والحل بخط اليد: ${ex.expectedSteps.slice(0, 95)}`, 1085, y + 95);
          ctx.fillText(`الاستنتاج النهائي: ${ex.expectedFinal}`, 1085, y + 155);
        });

        const dataUrl = canvas.toDataURL('image/png');
        setSelectedImage(dataUrl);
        setScanResult(buildSimulatedResult(profile));
        showToast('تمت قراءة خط اليد وتصحيح الورقة من 300 درجة بنجاح!');
      };

      const handleImageUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          setSelectedImage(event.target.result);
          setScanResult(null);
          setScanError(null);
        };
        reader.readAsDataURL(file);
      };

      const runAiGrading = async () => {
        if (!selectedImage) {
          showToast('يرجى تصوير ورقة الطالب بكاميرا الآيفون أولاً', 'error');
          return;
        }
        if (!userApiKey.trim()) {
          // في حال لم يدخل المستخدم مفتاح API، نعرض تصحيحاً تجريبياً فورياً حتى لا يتوقف التطبيق
          setScanResult(buildSimulatedResult('excellent'));
          showToast('تم التصحيح بالمحرك المدمج! (أدخل مفتاح Gemini API في الأعلى لقراءة الصور الحقيقية بالكاميرا)');
          return;
        }

        setIsScanning(true);
        setScanError(null);
        try {
          const base64Data = selectedImage.split(',')[1];
          const mimeType = selectedImage.split(';')[0].split(':')[1] || 'image/png';
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${userApiKey.trim()}`;

          const promptText = `أنت مصحح رياضيات خبير للمنهاج السوري (${rubric.grade}) والدرجة العظمى ${totalExamPoints}. اقرأ خط يد الطالب في الصورة المرفقة وأعد النتيجة بصيغة JSON مطابقة لسلم التصحيح.`;

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }, { inlineData: { mimeType, data: base64Data } }] }],
              generationConfig: { responseMimeType: 'application/json' }
            })
          });

          if (!response.ok) throw new Error('تأكد من صحة مفتاح Gemini API أو الاتصال بالإنترنت.');
          const result = await response.json();
          const parsed = JSON.parse(result.candidates[0].content.parts[0].text);
          setScanResult(parsed);
          showToast('تمت قراءة خط اليد بالذكاء الاصطناعي بنجاح!');
        } catch (err) {
          setScanError(err.message);
        } finally {
          setIsScanning(false);
        }
      };

      const saveResultToRoster = () => {
        if (!scanResult) return;
        const s1Score = scanResult.mcqResults.reduce((s, r) => s + Number(r.awardedPoints || 0), 0);
        const s2Score = scanResult.blankResults.reduce((s, r) => s + Number(r.awardedPoints || 0), 0);
        const s3Score = scanResult.exerciseResults.reduce((s, r) => s + Number(r.awardedPoints || 0), 0);
        const totalScore = s1Score + s2Score + s3Score;

        const newRecord = {
          id: `st-${Date.now()}`,
          studentName: scanResult.studentName || 'طالب بدون اسم',
          studentClass: scanResult.studentClass || rubric.grade,
          gradeLevel: rubric.grade,
          date: new Date().toISOString().slice(0, 10),
          s1Score, s1Max: s1MaxPoints,
          s2Score, s2Max: s2MaxPoints,
          s3Score, s3Max: s3MaxPoints,
          totalScore, maxScore: totalExamPoints,
          feedback: scanResult.overallFeedback || ''
        };
        setRoster([newRecord, ...roster]);
        showToast(`تم حفظ درجة الطالب (${totalScore} / 300) في السجل!`);
        setActiveTab('roster');
      };

      const exportRosterToCSV = () => {
        const headers = ['اسم الطالب', 'الصف والشعبة', 'س1 (من 60)', 'س2 (من 60)', 'س3 (من 180)', 'المجموع من 300', 'ملاحظات التصحيح'];
        const rows = roster.map((r) =>
          [`"${r.studentName}"`, `"${r.studentClass}"`, r.s1Score, r.s2Score, r.s3Score, r.totalScore, `"${r.feedback}"`].join(',')
        );
        const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.setAttribute('download', `درجات_الرياضيات_300_${rubric.grade}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="min-h-screen pb-24">
          {notification && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-emerald-300 px-5 py-3 rounded-2xl shadow-xl text-xs font-bold border border-emerald-500/40 no-print">
              {notification.msg}
            </div>
          )}

          {/* الهيدر */}
          <header className="bg-gradient-to-l from-slate-900 via-indigo-950 to-emerald-950 text-white p-4 shadow-lg no-print">
            <div className="max-w-5xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-3">
              <div>
                <h1 className="text-lg md:text-xl font-black">
                  المصحح الذكي لخط اليد والبراهين (300 درجة) - المنهاج السوري
                </h1>
                <p className="text-xs text-emerald-200 mt-0.5">
                  نسخة مستقلة تعمل مباشرة على الآيفون والكمبيوتر (السابع - الثامن - العاشر)
                </p>
              </div>
              <div className="flex items-center gap-2">
                <input
                  type="password"
                  value={userApiKey}
                  onChange={(e) => setUserApiKey(e.target.value)}
                  placeholder="مفتاح Gemini API (اختياري للكاميرا)"
                  className="bg-white/10 border border-white/20 rounded-xl px-3 py-1.5 text-xs text-white placeholder-white/50 w-56"
                />
                <span className="bg-amber-400 text-slate-950 text-xs px-3 py-1.5 rounded-xl font-black">
                  {totalExamPoints} / 300
                </span>
              </div>
            </div>

            {/* أزرار التنقل العلوية */}
            <div className="max-w-5xl mx-auto mt-4 flex flex-wrap gap-2">
              <button onClick={() => setActiveTab('scanner')} className={`px-4 py-2 rounded-xl text-xs font-extrabold ${activeTab === 'scanner' ? 'bg-white text-slate-900' : 'bg-white/10 text-white'}`}>
                1. المسح الضوئي وتصحيح خط اليد
              </button>
              <button onClick={() => setActiveTab('rubric')} className={`px-4 py-2 rounded-xl text-xs font-extrabold ${activeTab === 'rubric' ? 'bg-white text-slate-900' : 'bg-white/10 text-white'}`}>
                2. سلم التصحيح (300 درجة)
              </button>
              <button onClick={() => setActiveTab('sheet')} className={`px-4 py-2 rounded-xl text-xs font-extrabold ${activeTab === 'sheet' ? 'bg-white text-slate-900' : 'bg-white/10 text-white'}`}>
                3. طباعة الورقة القياسية
              </button>
              <button onClick={() => setActiveTab('roster')} className={`px-4 py-2 rounded-xl text-xs font-extrabold ${activeTab === 'roster' ? 'bg-white text-slate-900' : 'bg-white/10 text-white'}`}>
                4. سجل الدرجات و Excel ({roster.length})
              </button>
            </div>
          </header>

          <main className="max-w-5xl mx-auto p-4 space-y-5">
            {/* اختيار الصف الدراسي */}
            <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-3 no-print">
              <span className="text-xs font-extrabold text-slate-700">اختر قالب المنهاج السوري الجاهز (من 300 درجة):</span>
              <div className="flex flex-wrap gap-2">
                <button onClick={() => applyPreset('grade7')} className={`px-3.5 py-2 rounded-xl text-xs font-extrabold border ${rubric.grade.includes('السابع') ? 'bg-slate-900 text-white' : 'bg-slate-50'}`}>
                  الصف السابع (300)
                </button>
                <button onClick={() => applyPreset('grade8')} className={`px-3.5 py-2 rounded-xl text-xs font-extrabold border ${rubric.grade.includes('الثامن') ? 'bg-slate-900 text-white' : 'bg-slate-50'}`}>
                  الصف الثامن (300)
                </button>
                <button onClick={() => applyPreset('grade10')} className={`px-3.5 py-2 rounded-xl text-xs font-extrabold border ${rubric.grade.includes('العاشر') ? 'bg-slate-900 text-white' : 'bg-slate-50'}`}>
                  الصف العاشر (300)
                </button>
              </div>
            </div>

            {activeTab === 'scanner' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                <div className="lg:col-span-5 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <h3 className="text-sm font-extrabold text-slate-900">التقاط صورة الورقة بكاميرا الآيفون أو التجربة الفورية</h3>

                  <div className="grid grid-cols-2 gap-3">
                    <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" onChange={handleImageUpload} className="hidden" />
                    <button onClick={() => cameraInputRef.current?.click()} className="p-4 rounded-2xl bg-emerald-600 text-white font-extrabold text-xs shadow">
                      📷 فتح كاميرا الآيفون
                    </button>

                    <input ref={fileInputRef} type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                    <button onClick={() => fileInputRef.current?.click()} className="p-4 rounded-2xl bg-slate-800 text-white font-extrabold text-xs shadow">
                      📁 رفع صورة من الجهاز
                    </button>
                  </div>

                  <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 space-y-2">
                    <p className="text-xs font-extrabold text-amber-950">تجربة فورية لتصحيح خط اليد والبراهين (بدون طابعة):</p>
                    <div className="grid grid-cols-2 gap-2">
                      <button onClick={() => generateHandwrittenStudentSheet('excellent')} className="py-2 px-3 rounded-xl bg-white border border-amber-300 text-xs font-bold">
                        ✨ ورقة طالب متفوق (300/300)
                      </button>
                      <button onClick={() => generateHandwrittenStudentSheet('partial')} className="py-2 px-3 rounded-xl bg-white border border-amber-300 text-xs font-bold">
                        ⚖️ ورقة بعلامة جزئية
                      </button>
                    </div>
                  </div>

                  {selectedImage && (
                    <div className="space-y-3">
                      <img src={selectedImage} alt="ورقة الطالب" className="w-full max-h-80 object-contain rounded-xl border border-slate-300 bg-slate-900" />
                      <button onClick={runAiGrading} disabled={isScanning} className="w-full py-3 rounded-xl bg-emerald-600 text-white font-extrabold text-xs">
                        {isScanning ? 'جاري قراءة الخط...' : 'بدء قراءة خط اليد والتصحيح الذكي (من 300)'}
                      </button>
                    </div>
                  )}
                  {scanError && <div className="p-3 rounded-xl bg-red-50 text-red-700 text-xs font-bold">{scanError}</div>}
                </div>

                <div className="lg:col-span-7 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                  {scanResult ? (
                    <div className="space-y-4">
                      <div className="bg-slate-900 text-white p-4 rounded-2xl flex items-center justify-between">
                        <div>
                          <div className="text-xs text-emerald-300 font-bold">اسم الطالب المقروء:</div>
                          <div className="text-base font-black">{scanResult.studentName}</div>
                          <div className="text-xs text-slate-300">{scanResult.studentClass}</div>
                        </div>
                        <div className="text-center bg-emerald-500/20 border border-emerald-400/40 px-4 py-2 rounded-xl">
                          <div className="text-[11px] text-emerald-200">الدرجة المستحقة</div>
                          <div className="text-2xl font-black text-amber-300">
                            {scanResult.mcqResults.reduce((s, r) => s + Number(r.awardedPoints || 0), 0) +
                              scanResult.blankResults.reduce((s, r) => s + Number(r.awardedPoints || 0), 0) +
                              scanResult.exerciseResults.reduce((s, r) => s + Number(r.awardedPoints || 0), 0)} / {totalExamPoints}
                          </div>
                        </div>
                      </div>

                      <div className="space-y-2">
                        <h4 className="text-xs font-extrabold bg-slate-100 p-2 rounded-lg">تفصيل قراءة البراهين والتمارين (السؤال الثالث - {s3MaxPoints} درجة):</h4>
                        {scanResult.exerciseResults.map((ex, i) => (
                          <div key={i} className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-xs space-y-1">
                            <div className="flex justify-between font-black">
                              <span>التمرين ({ex.exerciseNumber}) - {ex.stepsBreakdown}</span>
                              <span className="text-emerald-700">{ex.awardedPoints} / {ex.maxPoints} درجة</span>
                            </div>
                            <p className="text-indigo-950 font-bold">{ex.transcribedSteps}</p>
                            <p className="text-emerald-800">{ex.teacherNote}</p>
                          </div>
                        ))}
                      </div>

                      <button onClick={saveResultToRoster} className="w-full py-3.5 rounded-xl bg-emerald-600 text-white font-black text-xs shadow">
                        حفظ النتيجة في سجل الدرجات (من 300)
                      </button>
                    </div>
                  ) : (
                    <div className="h-full flex flex-col items-center justify-center text-center py-12 text-slate-500 text-xs">
                      اضغط على زر "ورقة طالب متفوق" أو صوّر ورقة بكاميرا الآيفون لعرض التقرير المفصل من 300 درجة.
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'rubric' && (
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-black">إعداد سلم التصحيح وتوزيع الـ 300 درجة</h3>
                  <div className="flex gap-2">
                    <button onClick={() => autoBalanceTo300(4)} className="px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-bold">
                      4 تمارين (45 درجة للتمرين)
                    </button>
                    <button onClick={() => autoBalanceTo300(5)} className="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold">
                      5 تمارين (36 درجة للتمرين)
                    </button>
                  </div>
                </div>
                <p className="text-xs text-slate-600">
                  التوزيع القياسي المعتمد: السؤال الأول 60 درجة (4×15) + السؤال الثاني 60 درجة (4×15) + السؤال الثالث 180 درجة = 300 درجة.
                </p>
              </div>
            )}

            {activeTab === 'sheet' && (
              <div className="space-y-4">
                <div className="flex justify-end no-print">
                  <button onClick={() => window.print()} className="px-5 py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold text-xs shadow">
                    🖨️ طباعة ورقة الإجابة القياسية (A4)
                  </button>
                </div>
                <div id="printable-answer-sheet" className="bg-white p-8 rounded-xl border-2 border-slate-900 relative text-xs space-y-4">
                  <div className="border-b-2 border-slate-900 pb-3 flex justify-between items-center font-bold">
                    <div>
                      <p>الجمهورية العربية السورية</p>
                      <p>{rubric.schoolName}</p>
                      <p>{rubric.grade}</p>
                    </div>
                    <div className="text-center">
                      <h2 className="text-base font-black">{rubric.title}</h2>
                      <p className="text-[11px]">ورقة إجابة قياسية مخصصة لقراءة خط اليد والبراهين</p>
                    </div>
                    <div className="border-2 border-slate-900 px-3 py-1.5 rounded-lg font-black">
                      الدرجة: ....... / {totalExamPoints}
                    </div>
                  </div>

                  <div>
                    <h4 className="font-extrabold bg-slate-100 p-2 border border-slate-400">السؤال الأول: اختر الإجابة الصحيحة ({s1MaxPoints} درجة)</h4>
                    {rubric.mcq.map((q, i) => (
                      <div key={q.id} className="flex justify-between items-center py-2 border-b border-slate-200">
                        <span className="font-bold">{i + 1}) {q.questionHint} [{q.optionsText}]</span>
                        <span className="font-black">( أ )  ( ب )  ( ج )  ( د )</span>
                      </div>
                    ))}
                  </div>

                  <div>
                    <h4 className="font-extrabold bg-slate-100 p-2 border border-slate-400">السؤال الثاني: املأ الفراغات ({s2MaxPoints} درجة)</h4>
                    {rubric.blanks.map((b, i) => (
                      <div key={b.id} className="flex justify-between items-center py-2 border-b border-slate-200">
                        <span className="font-bold">{i + 1}) {b.prompt}</span>
                        <span className="w-56 h-7 border border-slate-700 inline-block"></span>
                      </div>
                    ))}
                  </div>

                  <div>
                    <h4 className="font-extrabold bg-slate-100 p-2 border border-slate-400">السؤال الثالث: حل التمارين والبراهين بالتفصيل ({s3MaxPoints} درجة)</h4>
                    {activeExercises.map((ex) => (
                      <div key={ex.id} className="border border-slate-600 rounded p-2.5 my-2">
                        <div className="font-bold border-b border-slate-300 pb-1 mb-6">{ex.title} ({ex.points} درجة): {ex.prompt}</div>
                        <div className="h-16 border-b border-dashed border-slate-300"></div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'roster' && (
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-black">سجل درجات الطلاب (من 300 درجة)</h3>
                  <button onClick={exportRosterToCSV} className="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-extrabold">
                    📥 تصدير الكشف إلى Excel (CSV)
                  </button>
                </div>
                <table className="w-full text-right text-xs border-collapse">
                  <thead>
                    <tr className="bg-slate-100 border-b border-slate-200">
                      <th className="p-2.5">اسم الطالب</th>
                      <th className="p-2.5">الصف</th>
                      <th className="p-2.5">س1</th>
                      <th className="p-2.5">س2</th>
                      <th className="p-2.5">س3</th>
                      <th className="p-2.5">المجموع من 300</th>
                    </tr>
                  </thead>
                  <tbody>
                    {roster.map((r) => (
                      <tr key={r.id} className="border-b border-slate-100">
                        <td className="p-2.5 font-bold">{r.studentName}</td>
                        <td className="p-2.5">{r.studentClass}</td>
                        <td className="p-2.5">{r.s1Score}/60</td>
                        <td className="p-2.5">{r.s2Score}/60</td>
                        <td className="p-2.5">{r.s3Score}/180</td>
                        <td className="p-2.5 font-black text-emerald-700">{r.totalScore} / {r.maxScore}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
